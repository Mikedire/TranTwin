trigger: none
pr: none

parameters:
- name: environment
  type: string
  default: staging
  values:
  - dev
  - staging
  - prod

variables:
- group: ovh-secrets # contains REGISTRY creds, etc.
- group: ovh-terraform # contains OVH_S3_ACCESS_KEY, OVH_S3_SECRET_KEY

stages:
- stage: Terraform
  displayName: "Terraform IaC"
  jobs:
  - job: Apply
    pool:
      vmImage: ubuntu-latest
    steps:
    # 1. Download kubeconfig (same as your app deploy pipeline)
    - task: DownloadSecureFile@1
      name: GetKubeconfig
      inputs:
        secureFile: 'kubeconfig-dto4t.yml'

    # 2. Install Terraform
    - task: Bash@3
      displayName: "Install Terraform"
      inputs:
        targetType: 'inline'
        script: |
          echo "🔧 Installing Terraform"
          sudo apt-get update && sudo apt-get install -y wget unzip
          wget -q https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip
          unzip -o terraform_1.9.5_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform -version

    # 3. Setup kubeconfig
    - task: Bash@3
      displayName: "Setup kubeconfig"
      inputs:
        targetType: 'inline'
        script: |
          echo "📁 Setting up kubeconfig"
          mkdir -p ~/.kube
          cp $(GetKubeconfig.secureFilePath) ~/.kube/config
          kubectl config use-context kubernetes-admin@DTO4T
          kubectl config get-contexts

    # 4. Terraform Init, Plan, Apply
    - task: Bash@3
      displayName: "Terraform Init, Plan & Apply"
      inputs:
        targetType: 'inline'
        script: |
          echo "⚙️ Exporting OVH Object Storage credentials"
          export AWS_ACCESS_KEY_ID=$(OVH_S3_ACCESS_KEY)
          export AWS_SECRET_ACCESS_KEY=$(OVH_S3_SECRET_KEY)

          echo "⚙️ Running Terraform for ${{ parameters.environment }}"
          cd terraform/environments/${{ parameters.environment }}

          terraform init \
            -backend-config="bucket=dto4t-tfstate" \
            -backend-config="key=${{ parameters.environment }}/terraform.tfstate" \
            -backend-config="region=uk" \
            -backend-config="endpoint=https://s3.uk.io.cloud.ovh.net" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

          terraform plan -var-file=${{ parameters.environment }}.tfvars -out=tfplan
          terraform apply -auto-approve tfplan
