trigger:
- main

pool:
  vmImage: 'windows-latest'
      
stages:
- stage: BuildAndAnalyze
  displayName: "Build and SonarQube Analysis"
  jobs:
  - job: Build
    steps:
    - task: SonarQubePrepare@7
      inputs:
        SonarQube: 'sonar-products'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'DQ_PRODUCTS_DTO4T_dcbcc6f9-1d39-4012-b50e-e568be13b7a8'
        cliProjectName: 'DTO4T'
        cliSources: '.'
        extraProperties: |
          sonar.sourceEncoding=UTF-8
          sonar.branch.name=   # 👈 clears the branch property

    - task: SonarQubeAnalyze@7

    - task: SonarQubePublish@7
      inputs:
        pollingTimeoutSec: '300'
